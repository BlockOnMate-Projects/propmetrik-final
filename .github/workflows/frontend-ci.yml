name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - 'packages/**'
      - '.github/workflows/frontend-ci.yml'
      - 'package-lock.json'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - 'packages/**'
      - '.github/workflows/frontend-ci.yml'
      - 'package-lock.json'

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Next.js app
        working-directory: ./frontend
        run: npm run build
        env:
          # CI build only — not used at runtime; satisfies NextAuth/env checks during compile.
          AUTH_SECRET: ci-build-placeholder-secret-min-32-chars-long
          NEXTAUTH_SECRET: ci-build-placeholder-secret-min-32-chars-long
          NEXTAUTH_URL: http://localhost:3000
