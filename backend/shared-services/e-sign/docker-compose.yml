# PropMetrik E-Sign Service Docker Compose
# Runs the E-Sign Python service on port 8002

version: '3.8'

services:
  # E-Sign Backend API (Python FastAPI)
  esign-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: propmetrik-esign-api
    ports:
      - "8002:8002"
    volumes:
      - .:/app
      - ./uploads:/app/uploads
    environment:
      - ENVIRONMENT=development
      - PORT=8002
      # PropMetrik Integration
      - JWT_SECRET=${JWT_SECRET:-your-development-jwt-secret}
      - PROPMETRIK_API_URL=${PROPMETRIK_API_URL:-http://host.docker.internal:4000}
      - KEYCLOAK_ENABLED=false
      # Database (PropMetrik database, esign schema)
      - POSTGRES_HOST=${POSTGRES_HOST:-host.docker.internal}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-propmetrik}
      - POSTGRES_USER=${POSTGRES_USER:-propmetrik_app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # Google OAuth (optional)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # SMTP (optional)
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    restart: unless-stopped
    networks:
      - propmetrik-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  propmetrik-network:
    external: true

volumes:
  esign-uploads:
