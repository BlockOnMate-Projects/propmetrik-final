# PROPMETRIK Docker Compose — PRODUCTION BASE
#
# Dev source-mounts and overrides live in docker-compose.override.yml
# (automatically loaded by `docker compose up` locally).
#
# Usage:
#   Development: docker-compose up -d           (auto-loads override)
#   Production:  Coolify deploys this file only
#   With local DBs: docker-compose --profile local-db up -d

services:
  # ============================================
  # Backend API Service (Node.js)
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: propmetrik-api
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - ML_SERVING_URL=http://ml-serving:8000
      - PYTHON_VALUATION_URL=http://valuation-engine:8001
      - ONLYOFFICE_INTERNAL_URL=http://onlyoffice:80
      - SCRAPY_WORKER_URL=http://scrapy-worker:5000
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      ml-serving:
        condition: service_started
      valuation-engine:
        condition: service_started
    networks:
      # propmetrik-network: talk to ml-serving/valuation-engine/etc by service name.
      # coolify: Coolify's Traefik proxy network — REQUIRED so api.propmetrik.com routes
      # to this container. Without it a clean redeploy leaves api unreachable (504).
      - propmetrik-network
      - coolify
    deploy:
      resources:
        limits:
          cpus: '${API_CPU_LIMIT:-1.0}'
          memory: ${API_MEMORY_LIMIT:-2G}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================
  # ML Model Serving Service (FastAPI/Python)
  # ============================================
  ml-serving:
    # Prebuilt in CI (.github/workflows/python-images.yml) and pulled here — Coolify
    # does NOT rebuild this on the prod host. Local dev re-adds `build:` via the override.
    image: ghcr.io/cedyngroup/propmetrik-ml-serving:${PYTHON_IMAGE_TAG:-latest}
    container_name: propmetrik-ml-serving
    ports:
      - "${ML_PORT:-8000}:8000"
    volumes:
      - ml-models:/app/models
    environment:
      - MODEL_STORAGE_PATH=/app/models
      - PREDICTION_CACHE_TTL=3600
      - MAX_BATCH_SIZE=100
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - propmetrik-network
    deploy:
      resources:
        limits:
          cpus: '${ML_SERVING_CPU_LIMIT:-1.5}'
          memory: ${ML_SERVING_MEMORY_LIMIT:-4G}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 180s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================
  # Python Valuation Engine Service (FastAPI)
  # ============================================
  valuation-engine:
    # Prebuilt in CI and pulled here (see ml-serving note).
    image: ghcr.io/cedyngroup/propmetrik-valuation-engine:${PYTHON_IMAGE_TAG:-latest}
    container_name: propmetrik-valuation-engine
    environment:
      - API_PORT=8001
      - ML_SERVING_URL=http://ml-serving:8000
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      ml-serving:
        condition: service_started
    networks:
      - propmetrik-network
    deploy:
      resources:
        limits:
          cpus: '${VALUATION_ENGINE_CPU_LIMIT:-1.0}'
          memory: ${VALUATION_ENGINE_MEMORY_LIMIT:-2G}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================
  # Scrapy Worker (Property Data Scraping)
  # ============================================
  scrapy-worker:
    # Prebuilt in CI and pulled here (see ml-serving note).
    image: ghcr.io/cedyngroup/propmetrik-scrapy-worker:${PYTHON_IMAGE_TAG:-latest}
    container_name: propmetrik-scrapy-worker
    volumes:
      - scrapy-items:/app/items
      - scrapy-logs:/var/log/cron
    environment:
      - SCRAPY_AUTO_START=${SCRAPY_AUTO_START:-true}
      - SCRAPY_ENABLED_SPIDERS=${SCRAPY_ENABLED_SPIDERS:-meqasa,housemaster,gpc,realtor,tonaton,daily_graphic_legal,airbnb_ghana,ownkey}
      - SCRAPY_INITIAL_SCRAPE=${SCRAPY_INITIAL_SCRAPE:-false}
      - SCRAPY_MODE=api
      - SCRAPY_API_PORT=5000
      - ETL_TRACKING_ENABLED=true
      - ETL_API_URL=http://api:3000/api/v1
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    networks:
      - propmetrik-network
    deploy:
      resources:
        limits:
          cpus: '${SCRAPY_CPU_LIMIT:-0.5}'
          memory: ${SCRAPY_MEMORY_LIMIT:-1G}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ============================================
  # OnlyOffice Document Server
  # ============================================
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: propmetrik-onlyoffice
    ports:
      - "${ONLYOFFICE_PORT:-8081}:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-propmetrik_onlyoffice_secret}
      - JWT_HEADER=Authorization
      - JWT_IN_BODY=true
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_fonts:/usr/share/fonts/truetype/custom
    restart: unless-stopped
    networks:
      - propmetrik-network
    deploy:
      resources:
        limits:
          cpus: '${ONLYOFFICE_CPU_LIMIT:-1.0}'
          memory: ${ONLYOFFICE_MEMORY_LIMIT:-2G}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================
  # LibreOffice Headless (PDF Conversion)
  # ============================================
  libreoffice:
    image: linuxserver/libreoffice:latest
    container_name: propmetrik-libreoffice
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Accra
    volumes:
      - libreoffice_config:/config
      - libreoffice_temp:/tmp/propmetrik-pdf
    restart: unless-stopped
    networks:
      - propmetrik-network
    command: /bin/bash -c "while true; do sleep 3600; done"
    deploy:
      resources:
        limits:
          cpus: '${LIBREOFFICE_CPU_LIMIT:-0.5}'
          memory: ${LIBREOFFICE_MEMORY_LIMIT:-1G}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Optional: Local PostgreSQL (for offline dev)
  # ============================================
  postgres-local:
    image: postgis/postgis:15-3.3-alpine
    container_name: propmetrik-postgres-local
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=propmetrik
      - POSTGRES_PASSWORD=propmetrik_dev
      - POSTGRES_DB=propmetrik
    volumes:
      - postgres-data:/var/lib/postgresql/data
    profiles:
      - local-db
    networks:
      - propmetrik-network

  # ============================================
  # Optional: Local Redis (for offline dev)
  # ============================================
  redis-local:
    image: redis:7-alpine
    container_name: propmetrik-redis-local
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    profiles:
      - local-db
    networks:
      - propmetrik-network

  # ============================================
  # Optional: Nginx Reverse Proxy
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: propmetrik-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - onlyoffice
    restart: unless-stopped
    networks:
      - propmetrik-network
    profiles:
      - with-nginx
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  propmetrik-network:
    driver: bridge
  # Coolify's shared proxy (Traefik) network — created/managed by Coolify, not here.
  # The api service joins it so the public domain (api.propmetrik.com) is routable
  # after every deploy. `external: true` = use the existing network, don't create it.
  coolify:
    external: true

volumes:
  ml-models:
  onlyoffice_data:
  onlyoffice_logs:
  onlyoffice_fonts:
  libreoffice_config:
  libreoffice_temp:
  scrapy-items:
  scrapy-logs:
  postgres-data:
  redis-data:
