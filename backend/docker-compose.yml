# Propmetrik Development Docker Compose
# For local development with external services (PostgreSQL, Redis, etc. on remote servers)

version: '3.8'

services:
  # Backend API service
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: propmetrik-api
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules  # Preserve node_modules from container
    environment:
      - NODE_ENV=development
      - PORT=3000
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - propmetrik-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Local PostgreSQL for testing (optional)
  postgres-local:
    image: postgis/postgis:15-3.3-alpine
    container_name: propmetrik-postgres-local
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=propmetrik
      - POSTGRES_PASSWORD=propmetrik_dev
      - POSTGRES_DB=propmetrik
    volumes:
      - postgres-data:/var/lib/postgresql/data
    profiles:
      - local-db
    networks:
      - propmetrik-network

  # Local Redis for testing (optional)
  redis-local:
    image: redis:7-alpine
    container_name: propmetrik-redis-local
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    profiles:
      - local-db
    networks:
      - propmetrik-network

  # Local MinIO for testing (optional)
  minio-local:
    image: minio/minio:latest
    container_name: propmetrik-minio-local
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=propmetrik
      - MINIO_ROOT_PASSWORD=propmetrik_minio_dev
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    profiles:
      - local-db
    networks:
      - propmetrik-network

  # Local OpenSearch for testing (optional)
  opensearch-local:
    image: opensearchproject/opensearch:2.11.0
    container_name: propmetrik-opensearch-local
    ports:
      - "9200:9200"
      - "9600:9600"
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    profiles:
      - local-db
    networks:
      - propmetrik-network

networks:
  propmetrik-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  opensearch-data:
